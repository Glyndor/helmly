name: CodeQL

# Every pull request into develop or main is analysed before it merges, and each of the
# two branches again after the merge, so an alert shows up where the change enters and
# not at the release. The weekly run catches a query added to the suite since.
#
# The category `/language:<language>` is the one GitHub's default setup used, so the
# alerts that already exist keep their identity. `javascript-typescript` is one CodeQL
# language for the dashboard UI; Rust is the server and the CLI under `internal/`.
# No build is needed for any of the three.
#
# The configuration file leaves out test code and nothing else (see the comments in it and the
# test that guards it, `.github/scripts/codeql/test_codeql_paths.py`).

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

# There is no concurrency group: a newer push to a pull request must not cancel the analysis
# of the one before it, and a run waiting behind another must not be replaced, because a
# commit that was never analysed is a commit whose alerts nobody saw.

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
