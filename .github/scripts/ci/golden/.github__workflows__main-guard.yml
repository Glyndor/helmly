name: guard

on:
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  develop-only:
    name: develop-only
    runs-on: ubuntu-latest
    steps:
      # The branch has to be `develop` of this repository. The name alone is not enough: a fork
      # can have a branch called develop, and its head repository is a different one.
      - name: Require develop of this repository as the source
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::Pull requests into main must come from this repository (got '$HEAD_REPO')."
            exit 1
          fi
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::Pull requests into main must come from develop (got $HEAD_REF)."
            exit 1
          fi
          echo "Source branch is develop of this repository."
