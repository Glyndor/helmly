name: release-dashboard

on:
  push:
    tags:
      - "dashboard@*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. dashboard@1.1.0)"
        required: true
      dry_run:
        description: "Build, sign and upload the artifacts of this run, and publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Everything below needs this job. The tag comes from the event (the name of a pushed tag, or
  # what the person who started the run typed), so it is checked here against the shape of a
  # release tag, and the other jobs take it from this job's output and never from the event.
  tag:
    name: Validate the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        name: Check the shape of the tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^dashboard@[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::the tag is not dashboard@MAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  prepare:
    name: Verify sqlx cache
    needs: [tag]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: helmly_ci
          POSTGRES_PASSWORD: helmly_ci
          POSTGRES_DB: helmly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: internal

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --locked --version 0.9.1

      - name: Run migrations
        env:
          DATABASE_URL: postgres://helmly_ci:helmly_ci@localhost:5432/helmly_ci
        run: sqlx migrate run --source dashboard/server/migrations

      - name: Verify sqlx cache is up-to-date
        working-directory: internal/dashboard/server
        env:
          DATABASE_URL: postgres://helmly_ci:helmly_ci@localhost:5432/helmly_ci
        run: cargo sqlx prepare --check

  ci-server:
    name: CI server (Rust)
    needs: [tag]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: helmly_ci
          POSTGRES_PASSWORD: helmly_ci
          POSTGRES_DB: helmly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: internal

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      DATABASE_URL: postgres://helmly_ci:helmly_ci@localhost:5432/helmly_ci
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --locked --version 0.9.1

      - name: Install cargo-audit
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/install-cargo-audit.sh

      - name: Run migrations
        run: sqlx migrate run --source dashboard/server/migrations

      - name: fmt
        run: cargo fmt --package helmly-dashboard-server -- --check

      - name: clippy
        run: cargo clippy --package helmly-dashboard-server -- -D warnings

      - name: test
        run: cargo test --package helmly-dashboard-server -- --test-threads=1

      - name: audit
        run: cargo-audit audit --deny warnings

  ci-ui:
    name: CI UI (frontend)
    needs: [tag]
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: internal/dashboard/ui

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bun
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/install-bun.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      - name: test
        run: bun run test

      - name: audit
        run: bun audit --audit-level high

  build:
    name: Build ${{ matrix.arch }}
    needs: [tag, prepare, ci-server, ci-ui]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust-target: x86_64-unknown-linux-musl
            bun-target: bun-linux-x64-musl
            use_cross: false

          - arch: arm64
            rust-target: aarch64-unknown-linux-musl
            bun-target: bun-linux-arm64-musl
            use_cross: true

    defaults:
      run:
        working-directory: internal

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --- Rust backend -------------------------------------------------------

      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.rust-target }}

      - name: Install musl toolchain (x86_64)
        if: ${{ !matrix.use_cross }}
        run: sudo apt-get install -y musl-tools

      - name: Install cross (arm64)
        if: ${{ matrix.use_cross }}
        run: cargo install cross --locked --version 0.2.5

      - name: Set version from tag
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/release/set_version.py" dashboard/server/Cargo.toml

      - name: Build backend (musl static)
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release \
              --package helmly-dashboard-server \
              --target ${{ matrix.rust-target }}
          else
            cargo build --release \
              --package helmly-dashboard-server \
              --target ${{ matrix.rust-target }}
          fi
        env:
          SQLX_OFFLINE: "true"

      - name: Collect the backend binary
        working-directory: ${{ github.workspace }}
        run: cp "internal/target/${{ matrix.rust-target }}/release/helmly-dashboard-server" "helmly-dashboard-backend-linux-${{ matrix.arch }}"

      # --- Frontend -----------------------------------------------------------

      - name: Install bun
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/install-bun.sh

      - name: Install frontend deps
        working-directory: internal/dashboard/ui
        run: bun install --frozen-lockfile

      - name: Build Next.js (standalone)
        working-directory: internal/dashboard/ui
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Copy static assets into standalone
        working-directory: internal/dashboard/ui
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Patch server.js for portable __dirname
        working-directory: internal/dashboard/ui
        run: |
          # bun --compile embeds the compile-time __dirname (CI path) into the binary.
          # At runtime on the deployment server that path does not exist, causing chdir to fail.
          # Fix: shadow __dirname with a version that falls back to the binary's own directory
          # when the compile-time path is absent from disk.
          node -e "
          const fs = require('fs');
          let content = fs.readFileSync('.next/standalone/server.js', 'utf8');
          content = content.replace(
            \"const path = require('path')\",
            \"const path = require('path')\\nconst __dirname = require('fs').existsSync(__dirname) ? __dirname : path.dirname(process.execPath)\"
          );
          fs.writeFileSync('.next/standalone/server.js', content);
          process.stdout.write('server.js patched: __dirname resolves to binary directory on deployment\\n');
          "

      - name: Compile standalone binary
        working-directory: internal/dashboard/ui
        run: |
          # --packages=external + --compile-autoload-package-json: packages are resolved from the
          # filesystem at runtime. The binary must be deployed alongside the standalone directory
          # (node_modules/ and .next/server/ from the assets tarball).
          bun build --compile \
            --target ${{ matrix.bun-target }} \
            --define 'process.env.NODE_ENV="production"' \
            --packages=external \
            --compile-autoload-package-json \
            .next/standalone/server.js \
            --outfile "helmly-dashboard-frontend-linux-${{ matrix.arch }}"

      - name: Bundle static assets
        working-directory: internal/dashboard/ui
        run: |
          # Full standalone: node_modules/ + .next/ (server chunks + static + manifests) + public/
          # Binary must be extracted into this same directory at deployment time.
          TARBALL="helmly-dashboard-frontend-assets-linux-${{ matrix.arch }}.tar.gz"
          tar -czf "$TARBALL" -C .next/standalone .
          echo "assets tarball: $(du -sh "$TARBALL" | cut -f1)"

      - name: Collect the frontend artifacts
        working-directory: ${{ github.workspace }}
        run: |
          cp "internal/dashboard/ui/helmly-dashboard-frontend-linux-${{ matrix.arch }}" .
          cp "internal/dashboard/ui/helmly-dashboard-frontend-assets-linux-${{ matrix.arch }}.tar.gz" .

      # --- Upload artifacts ---------------------------------------------------

      - name: Upload the unsigned artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-${{ matrix.arch }}
          path: |
            helmly-dashboard-backend-linux-${{ matrix.arch }}
            helmly-dashboard-frontend-linux-${{ matrix.arch }}
            helmly-dashboard-frontend-assets-linux-${{ matrix.arch }}.tar.gz
          retention-days: 1

  # A dry run signs with a key made in the job and says so; the release key is not read.
  sign-dry-run:
    name: Sign with a throwaway key (dry run)
    needs: [tag, build]
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The artifacts are data: each architecture goes to its own folder outside the checkout,
      # and nothing else of the run is downloaded.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-x86_64
          path: ${{ runner.temp }}/artifacts/x86_64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-arm64
          path: ${{ runner.temp }}/artifacts/arm64

      - name: Install the signing library from the pinned hashes
        run: |
          python3 -m venv "$RUNNER_TEMP/signvenv"
          "$RUNNER_TEMP/signvenv/bin/python" -m pip install --quiet --require-hashes --only-binary=:all: -r "$GITHUB_WORKSPACE/.github/scripts/release/sign-requirements.txt"

      - name: Make a throwaway key
        run: |
          KEY="$(python3 -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())')"
          echo "::add-mask::$KEY"
          echo "GLYNDOR_RELEASE_ED25519_KEY=$KEY" >> "$GITHUB_ENV"
          echo "Dry run: signing with a throwaway key made in this job. The release key is not read."

      - name: Sign
        env:
          SIGN_PYTHON: ${{ runner.temp }}/signvenv/bin/python
        run: bash "$GITHUB_WORKSPACE/.github/scripts/release/sign-artifacts.sh" "$RUNNER_TEMP/artifacts"

  # The only job that reads the signing key. It signs what the build jobs uploaded and creates
  # the release. A run started by hand must be started from the commit the tag points at.
  release:
    name: Sign and publish the release
    needs: [tag, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that this commit is the one the tag points at
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [ "$TAG_SHA" != "$RUN_SHA" ]; then
            echo "::error::$TAG points at $TAG_SHA and this run is at $RUN_SHA; start the run from the tag"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-x86_64
          path: ${{ runner.temp }}/artifacts/x86_64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-arm64
          path: ${{ runner.temp }}/artifacts/arm64

      - name: Install the signing library from the pinned hashes
        run: |
          python3 -m venv "$RUNNER_TEMP/signvenv"
          "$RUNNER_TEMP/signvenv/bin/python" -m pip install --quiet --require-hashes --only-binary=:all: -r "$GITHUB_WORKSPACE/.github/scripts/release/sign-requirements.txt"

      - name: Sign
        env:
          GLYNDOR_RELEASE_ED25519_KEY: ${{ secrets.GLYNDOR_RELEASE_ED25519_KEY }}
          SIGN_PYTHON: ${{ runner.temp }}/signvenv/bin/python
        run: bash "$GITHUB_WORKSPACE/.github/scripts/release/sign-artifacts.sh" "$RUNNER_TEMP/artifacts"

      - name: Create GitHub Release
        working-directory: ${{ runner.temp }}/artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --generate-notes \
            x86_64/helmly-dashboard-backend-linux-x86_64 \
            x86_64/helmly-dashboard-backend-linux-x86_64.sig \
            x86_64/helmly-dashboard-frontend-linux-x86_64 \
            x86_64/helmly-dashboard-frontend-linux-x86_64.sig \
            x86_64/helmly-dashboard-frontend-assets-linux-x86_64.tar.gz \
            x86_64/helmly-dashboard-frontend-assets-linux-x86_64.tar.gz.sig \
            arm64/helmly-dashboard-backend-linux-arm64 \
            arm64/helmly-dashboard-backend-linux-arm64.sig \
            arm64/helmly-dashboard-frontend-linux-arm64 \
            arm64/helmly-dashboard-frontend-linux-arm64.sig \
            arm64/helmly-dashboard-frontend-assets-linux-arm64.tar.gz \
            arm64/helmly-dashboard-frontend-assets-linux-arm64.tar.gz.sig
